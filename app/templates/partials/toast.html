<div class="toast align-items-center text-bg-{{ 'danger' if category == 'danger' else category if category in ['success','warning','info'] else 'primary' }} border-0 show mb-2"
     role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="5000">
    <div class="d-flex">
        <div class="toast-body">{{ message }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
</div>
