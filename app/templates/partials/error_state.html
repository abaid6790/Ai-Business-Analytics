<div class="error-state">
    <div class="error-state-icon">
        <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h5>{{ title | default('Something went wrong') }}</h5>
    <p class="text-muted">{{ subtitle | default('Please try again, or contact support if the problem persists.') }}</p>
    {% if retry_url %}
        <a href="{{ retry_url }}" class="btn btn-outline-primary btn-sm">Try again</a>
    {% endif %}
</div>
